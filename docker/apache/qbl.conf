ServerName qbl
ServerTokens Prod

# ---- HTTPS -----------------------------------------------------------------------------
# This server only ever speaks plain HTTP. TLS ends at the "edge" container (Caddy) in front of
# it, which forwards the request here and says how the visitor really connected in three headers:
#
#   X-Forwarded-Proto: https          X-Forwarded-For: <visitor's address>          Host: <public name>
#
# Nothing here needs a certificate.
#
# The public address. Set QBL_PUBLIC_URL (https://dev.questlab.cc) and that address is the site's
# own name: the start script (public-address.sh) writes qbl-public.conf, included below, which
# makes Apache name itself by it in every address it writes and treat every visit as https. Then
# nothing depends on what is in front keeping the Host header or sending X-Forwarded-Proto.
#
# What this file does with the forwarded headers:
#   * passes them on untouched to Laravel, which believes them only from the addresses in its
#     TRUSTED_PROXIES setting and from then on knows the site is https;
#   * makes sure a redirect sent from here goes to https:// when the visitor came by https;
#   * lets the multiplayer WebSocket through (the browser opens wss:// to the edge; here it
#     arrives as ws://);
#   * writes the visitor's address, not the edge's, in the access log.
#
# This server is not published: only the edge reaches it, and the edge replaces any forwarded
# headers a visitor sends with the real ones.
SetEnvIfNoCase X-Forwarded-Proto "^https$" QBL_HTTPS=1
LogFormat "%{X-Forwarded-For}i %h %l %u %t \"%r\" %>s %b \"%{X-Forwarded-Proto}i\"" qbl

# Laravel runs as PHP-FPM in the "app" container. Every PHP request goes to its front controller.
# Bearer tokens must reach PHP.
SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/app/public/index.php"

# ---- public site: the marketing page, the game, the editor, the API, the multiplayer socket
<VirtualHost *:80>
    DocumentRoot /var/www/public
    CustomLog /proc/self/fd/1 qbl

    # ServerName and UseCanonicalName from QBL_PUBLIC_URL, and QBL_HTTPS when it is https.
    IncludeOptional conf/extra/qbl-public.conf

    # A redirect that one of the containers behind this one sends (a missing trailing slash,
    # say) names http://; the visitor is on https://.
    Header edit Location "^http://" "https://" env=QBL_HTTPS
    Header always edit Location "^http://" "https://" env=QBL_HTTPS

    <Directory /var/www/public>
        Require all granted
        AllowOverride None
        Options -Indexes
        # "/" is the marketing site (index.html). Every other path that is not a file loads the
        # game (play.html): /missions, /{code}, /play?preview=…
        DirectoryIndex index.html
        FallbackResource /play.html
    </Directory>

    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml

    # Vite's build output is content-hashed and can be cached for good.
    <Directory /var/www/public/assets>
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </Directory>
    # The scenarios' pictures and sounds, mounted from the checkout's scenarios/assets.
    Alias /scenario-assets /var/www/scenario-assets
    <Directory /var/www/scenario-assets>
        Require all granted
        AllowOverride None
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 1 hour"
    </Directory>

    # Files uploaded in the editor. The "app" container writes them; this one only reads them.
    # They are images, sound and video with server-chosen names; they are never run as anything.
    Alias /media /var/www/media
    <Directory /var/www/media>
        Require all granted
        AllowOverride None
        Options -Indexes
        Header set Content-Security-Policy "default-src 'none'; sandbox"
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </Directory>

    # The scenario editor is its own container.
    ProxyPass        /editor/ http://editor:80/editor/
    ProxyPassReverse /editor/ http://editor:80/editor/
    ProxyPassReverse /editor/ http://editor/editor/

    # The documentation is its own container too.
    ProxyPass        /docs/ http://docs:80/docs/
    ProxyPassReverse /docs/ http://docs:80/docs/
    ProxyPassReverse /docs/ http://docs/docs/

    # Colyseus: matchmaking over HTTP, then a WebSocket per room.
    ProxyPass        /game/ http://colyseus:2567/ upgrade=websocket timeout=3600
    ProxyPassReverse /game/ http://colyseus:2567/

    RewriteEngine On
    # /editor and /docs without the slash. With QBL_PUBLIC_URL set, the second rule is used and
    # Apache writes the address from it. Without, the edge's X-Forwarded-Proto decides.
    RewriteCond %{ENV:QBL_CANONICAL} !=1
    RewriteCond %{HTTP:X-Forwarded-Proto} =https [NC]
    RewriteRule ^/(editor|docs)$ https://%{HTTP_HOST}/$1/ [R=302,L]
    RewriteRule ^/(editor|docs)$ /$1/ [R=302,L]
    # The game server's endpoints are never exposed to browsers.
    RewriteRule ^/api/internal(/|$) - [R=404,L]
    # The Laravel API.
    RewriteRule ^/api(/|$) fcgi://app:9000/app/public/index.php [P,L]
    # Never hand out PHP source from the shared public directory.
    RewriteRule \.php$ - [R=404,L]
</VirtualHost>

# ---- internal: lets the Colyseus container reach Laravel's /api/internal -------------
# Port 8081 is not published to the host; it exists only on the Docker network.
Listen 8081
<VirtualHost *:8081>
    RewriteEngine On
    RewriteRule ^/api/internal(/|$) fcgi://app:9000/app/public/index.php [P,L]
    RewriteRule ^ - [R=404,L]
</VirtualHost>
