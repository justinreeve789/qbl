ServerName editor
ServerTokens Prod

<Directory /usr/local/apache2/htdocs>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

Header always set X-Content-Type-Options nosniff
# The editor never needs to be shown inside another site.
Header always set X-Frame-Options DENY

# The page itself is looked up every time, so a new release shows up at once.
<Files "index.html">
    Header set Cache-Control "no-cache"
</Files>
# Vite's build output is content-hashed and can be cached for good.
<Directory /usr/local/apache2/htdocs/editor/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>
